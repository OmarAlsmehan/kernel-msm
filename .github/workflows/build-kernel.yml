name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - stock-g8-patch35

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git wget device-tree-compiler

      - name: Setup Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # Clang AOSP r383902
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
          mkdir clang && tar -xf clang-r383902.tar.gz -C clang
          
          # GCC Target Dependencies (LineageOS Mirrors)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Fix Camera Header
        run: |
          # Mantém a inclusão de headers do driver de câmera
          CAM_MAKEFILE="drivers/media/platform/msm/camera_v2/Makefile"
          if [ -f "$CAM_MAKEFILE" ]; then
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2" >> "$CAM_MAKEFILE"
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2/common" >> "$CAM_MAKEFILE"
          fi

      - name: Compile Kernel Image
        run: |
          CLANG_DIR=$GITHUB_WORKSPACE/toolchain/clang/bin
          GCC64_DIR=$GITHUB_WORKSPACE/toolchain/gcc64/bin
          GCC32_DIR=$GITHUB_WORKSPACE/toolchain/gcc32/bin
          
          export PATH=$CLANG_DIR:$GCC64_DIR:$GCC32_DIR:$PATH
          
          DTC_SYS=$(which dtc)
          
          BUILD_OPTIONS=(
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            REAL_CC=$CLANG_DIR/clang
            DTC=$DTC_SYS
          )
          
          # 1. Carrega a configuração exata do Moto G8 (rav_defconfig)
          make "${BUILD_OPTIONS[@]}" rav_defconfig
          
          # 2. Compila a imagem do Kernel
          make "${BUILD_OPTIONS[@]}" -j$(nproc --all) Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-MotoG8
          path: arch/arm64/boot/Image.gz
