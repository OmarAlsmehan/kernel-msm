name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - stock-g8-patch35

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
            default-jdk git gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
            python3 make sudo gcc g++ bc grep tofrodos python3-markdown libxml2-utils xsltproc zlib1g-dev python-is-python3 libc6-dev libtinfo6 \
            make repo cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd libyaml-dev --fix-missing && wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

      - name: Setup Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # Clang AOSP r383902
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
          mkdir clang && tar -xf clang-r383902.tar.gz -C clang
          
          # GCC Target Dependencies
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Compile Kernel Image and Modules
        run: |
          CLANG_DIR=$GITHUB_WORKSPACE/toolchain/clang/bin
          GCC64_DIR=$GITHUB_WORKSPACE/toolchain/gcc64/bin
          GCC32_DIR=$GITHUB_WORKSPACE/toolchain/gcc32/bin
          
          export PATH=$CLANG_DIR:$GCC64_DIR:$GCC32_DIR:$PATH
          
          BUILD_OPTIONS=(
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )
          
          # تنظيف بيئة البناء
          make "${BUILD_OPTIONS[@]}" clean
          make "${BUILD_OPTIONS[@]}" mrproper
          
          # تجهيز defconfig
          make "${BUILD_OPTIONS[@]}" rav_defconfig
          
          # بناء النواة والموديولات
          make "${BUILD_OPTIONS[@]}" -j$(nproc)
          make "${BUILD_OPTIONS[@]}" -j$(nproc) modules

      - name: Package with AnyKernel3
        run: |
          # تحميل AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # نسخ ملف النواة
          cp arch/arm64/boot/Image.gz AK3/
          
          # البحث عن الموديولات ونسخها لمجلد modules في AK3 (إن وجدت)
          find . -name "*.ko" -exec cp {} AK3/modules/vendor/lib/modules/ \; || true
          
          # ضغط الملفات لتصبح جاهزة للتفليش
          cd AK3
          zip -r9 ../AnyKernel3-MotoG8.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-MotoG8
          path: AnyKernel3-MotoG8.zip
