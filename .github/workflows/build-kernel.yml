name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - stock-g8-patch35

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git wget device-tree-compiler

      - name: Setup Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # Clang AOSP r383902
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
          mkdir clang && tar -xf clang-r383902.tar.gz -C clang
          
          # GCC Target Dependencies
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Fix Camera Headers & Includes
        run: |
          # Corrige include de msm_camera_tz_util.h no código da câmera
          find drivers/media/platform/msm/camera_v2/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/<msm_camera_tz_util.h>/"msm_camera_tz_util.h"/g' {} +

          CAM_MAKEFILE="drivers/media/platform/msm/camera_v2/Makefile"
          if [ -f "$CAM_MAKEFILE" ]; then
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2" >> "$CAM_MAKEFILE"
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2/common" >> "$CAM_MAKEFILE"
          fi

          CAM_COMMON_MAKEFILE="drivers/media/platform/msm/camera_v2/common/Makefile"
          if [ -f "$CAM_COMMON_MAKEFILE" ]; then
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2" >> "$CAM_COMMON_MAKEFILE"
            echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2/common" >> "$CAM_COMMON_MAKEFILE"
          fi

      - name: Compile Kernel Image
        run: |
          CLANG_DIR=$GITHUB_WORKSPACE/toolchain/clang/bin
          GCC64_DIR=$GITHUB_WORKSPACE/toolchain/gcc64/bin
          GCC32_DIR=$GITHUB_WORKSPACE/toolchain/gcc32/bin
          
          export PATH=$CLANG_DIR:$GCC64_DIR:$GCC32_DIR:$PATH
          DTC_SYS=$(which dtc)
          
          BUILD_OPTIONS=(
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            REAL_CC=$CLANG_DIR/clang
            DTC=$DTC_SYS
          )
          
          # 1. Carregar defconfig base da Motorola para o Moto G8 (rav / trinket)
          make "${BUILD_OPTIONS[@]}" vendor/trinket-perf_defconfig
          make "${BUILD_OPTIONS[@]}" vendor/ext_config/moto-trinket.config
          make "${BUILD_OPTIONS[@]}" vendor/ext_config/moto-trinket-rav.config
          
          # 2. Desativar conflitos de gerenciamento de bateria incorretos
          scripts/config --file .config --disable CONFIG_BATTERY_BQ27XXX
          scripts/config --file .config --disable CONFIG_QPNP_FG_GEN4
          scripts/config --file .config --enable CONFIG_QPNP_QG
          scripts/config --file .config --enable CONFIG_CHARGER_SMB1355
          
          # 3. Forçar apenas TOUCHSCREEN como Built-in (=y)
          scripts/config --file .config --enable CONFIG_INPUT_TOUCHSCREEN
          scripts/config --file .config --enable CONFIG_TOUCHSCREEN_GOODIX
          scripts/config --file .config --enable CONFIG_TOUCHSCREEN_FOCALTECH
          scripts/config --file .config --enable CONFIG_TOUCHSCREEN_SYNAPTICS_DSX
          scripts/config --file .config --enable CONFIG_TOUCHSCREEN_NOVATEK
          scripts/config --file .config --enable CONFIG_TOUCHSCREEN_NT36523
          
          # 4. Forçar apenas SENSORES (Qualcomm SSC / SLPI) como Built-in (=y)
          scripts/config --file .config --enable CONFIG_SENSORS
          scripts/config --file .config --enable CONFIG_SENSORS_SSC
          scripts/config --file .config --enable CONFIG_MSM_SLPI
          scripts/config --file .config --enable CONFIG_INPUT_SENSOR2
          scripts/config --file .config --enable CONFIG_SENSORS_ADSP
          scripts/config --file .config --enable CONFIG_INPUT_MISC
          scripts/config --file .config --enable CONFIG_INPUT_EVDEV
          
          # 5. Atualizar e resolver dependências do .config
          make "${BUILD_OPTIONS[@]}" olddefconfig
          
          # 6. Compilar a imagem do Kernel
          make "${BUILD_OPTIONS[@]}" -j$(nproc --all) Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-MotoG8
          path: arch/arm64/boot/Image.gz
